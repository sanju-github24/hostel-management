{% extends "base.html" %}{% block body %}
<h1>Students</h1>
<form class="row" method="post">
 <label>USN<input name="usn" required maxlength="15"></label>
 <label>Name<input name="name" required></label>
 <label>Email<input name="email" type="email" required></label>
 <label>Phone<input name="phone" maxlength="15"></label>
 <label>Department<input name="department" required></label>
 <label>Year<select name="year">{% for y in [1,2,3,4] %}<option>{{ y }}</option>{% endfor %}</select></label>
 <button>Add student</button>
</form>
<form class="row" method="get"><label>Search by name or USN<input name="q" value="{{ q }}"></label><button class="ghost">Search</button></form>
<div class="wrap"><table><tr><th>USN</th><th>Name</th><th>Dept</th><th>Year</th><th>Room</th><th>Phone</th><th></th></tr>
{% for s in rows %}<tr><td>{{ s.usn }}</td><td>{{ s.name }}</td><td>{{ s.department }}</td><td>{{ s.year }}</td>
<td>{{ s.room or 'Not allocated' }}</td>
<td><form method="post" action="{{ url_for('update_student', sid=s.student_id) }}" style="display:flex;gap:.3rem">
 <input name="phone" value="{{ s.phone or '' }}" style="width:120px"><input name="year" type="hidden" value="{{ s.year }}"><button class="ghost">Save</button></form></td>
<td><form method="post" action="{{ url_for('delete_student', sid=s.student_id) }}" onsubmit="return confirm('Delete {{ s.name }} and all their records?')"><button class="danger">Delete</button></form></td></tr>
{% else %}<tr><td colspan="7">No students match "{{ q }}".</td></tr>{% endfor %}</table></div>
{% endblock %}
